# Blueprint Render — TS Confecções
# Documentação: https://render.com/docs/blueprint-spec
#
# Antes do deploy, configure no painel (Environment):
#   MAIL_USERNAME, MAIL_PASSWORD (Senha de app Gmail)
#   MAIL_FROM_ADDRESS, APP_URL (https://seu-app.onrender.com)

databases:
  - name: confeccao-db
    plan: free
    databaseName: confeccao
    user: confeccao

services:
  - type: web
    name: confeccao-tb
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_NAME
        value: TS Confecções
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: confeccao-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: TS Confecções
